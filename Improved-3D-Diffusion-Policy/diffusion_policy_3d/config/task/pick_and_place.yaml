name: pick and place

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    point_cloud:
      shape: [4096, 3]
      type: point_cloud
    agent_pos:
      shape: [10]
      type: low_dim
  action:
    shape: [10]


dataset:
  _target_: diffusion_policy_3d.dataset.ur5_dataset_3d.Ur5Dataset3D
  zarr_path: data/pick_zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.00
  max_train_episodes: 20

  num_points: ${policy.pointcloud_encoder_cfg.num_points}
